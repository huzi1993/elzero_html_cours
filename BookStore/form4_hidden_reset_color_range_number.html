<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="descreption"
      content="This is the Hidden, Reset, Color, Range, Number lesson"
    />
    <title>Hidden, Reset, Color, Range, Number</title>
  </head>
  <body>
    <div>
      <h1>Hidden, Reset, Color, Range, Number Lesson</h1>
      <p>This İs Hidden, Reset, Color, Range, Number Lesson</p>
    </div>
    <form action="" method="GET">
      <input type="hidden" value="Huzeyfe" />
      <div>
        <label>Userame: </label>
        <input
          type="text"
          required="required"
          placeholder="Userame"
          name="user"
        />
      </div>
      <br />
      <div>
        <label>Anything: </label>
        <input type="text" name="any" />
      </div>
      <br />
      <div>
        <label>Password: </label>
        <input
          type="password"
          required
          placeholder="Write A Complex Password"
          name="pass"
        />
      </div>
      <br />
      <div>
        <label>Email: </label>
        <input
          type="email"
          required
          placeholder="Write A Valid Email"
          value="huzeyfe@gmail.com"
          name="email"
        />
      </div>
      <div>
        <label>Color: </label>
        <input type="color" name="color" />
      </div>
      <div>
        <label>Range: </label>
        <input
          type="range"
          required
          name="range"
          min="0"
          max="100"
          step="30"
          value="30"
        />
      </div>
      <div>
        <label>Number: </label>
        <input type="number" name="number" min="10" max="100" step="10" />
      </div>
      <input type="reset" value="Reset" />
      <input type="submit" value="Save" />
    </form>
  </body>
</html>
