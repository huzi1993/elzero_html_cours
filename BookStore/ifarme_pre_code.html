<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="This is the iFrame, Pre, Code lesson" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iFrame, Pre, Code</title>
  </head>
  <body>
    <div>
      <h1>iFrame, Pre, Code Lesson</h1>
      <p>This is iFrame, Pre, Code Lesson</p>
    </div>

    <!-- Displaying a code snippet -->
    <code> var x = 10; var y = 20; console.log(x + y); </code>

    <hr />

    <!-- Preserving spaces and formatting -->
    <pre>
var x = 10;
var y = 20;
console.log(x + y);
    </pre>

    <hr />

    <!-- Example of using <pre> for multi-line text -->
    <pre>
This is
New Line
New Line
New Line
New Line
    </pre>

    <hr />

    <!-- Embedding an iframe -->
    <iframe
      src="https://elzero.org/study/html-2021-study-plan/"
      width="400"
      height="400"
      style="border: 1px solid #000"
      title="Elzero Study Plan"
    >
    </iframe>
  </body>
</html>
