<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="this is the tables lesson" />
    <title>Tables</title>
  </head>
  <body>
    <!--
  thead
  tbody
  tfoot
  tr => table row
  td => table data cell
  th => header cell
  -->
    <table border="1">
      <caption>
        Student Marks
      </caption>
      <thead>
        <tr>
          <th>First</th>
          <th>Last</th>
          <th>Marks</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Ali</td>
          <td>keloğlan</td>
          <td>60</td>
        </tr>
        <tr>
          <td>Casim</td>
          <td>keloğlan</td>
          <td>30</td>
        </tr>
        <tr>
          <td>Halaf</td>
          <td>keloğlan</td>
          <td>55</td>
        </tr>
        <tr>
          <td>Veddah</td>
          <td>Hanfer</td>
          <td>90</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2">Total</td>
          <td>235</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
