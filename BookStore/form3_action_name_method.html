<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="descreption"
      content="This is the Action, Name, Method lesson"
    />
    <title>Action, Name, Method</title>
  </head>
  <body>
    <div>
      <h1>Action, Name, Method Lesson</h1>
      <p>This İs Action, Name, Method Lesson</p>
    </div>
    <form action="" method="POST">
      <div>
        <label>Userame: </label>
        <input
          type="text"
          required="required"
          placeholder="Userame"
          name="user"
        />
      </div>
      <br />
      <div>
        <label>Anything: </label>
        <input type="text" name="any" />
      </div>
      <br />
      <div>
        <label>Password: </label>
        <input
          type="password"
          required
          placeholder="Write A Complex Password"
          name="pass"
        />
      </div>
      <br />
      <div>
        <label>Email: </label>
        <input
          type="email"
          required
          placeholder="Write A Valid Email"
          value="huzeyfe@gmail.com"
          name="email"
        />
      </div>
      <input type="submit" value="Save" />
    </form>
  </body>
</html>
